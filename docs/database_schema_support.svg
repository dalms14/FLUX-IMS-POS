<text x="44" y="824.89" fill="#536760" font-family="Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Arrows: stored reference -&gt; target collection. Rxx: relationship register on page 4. *: schema-required field.</text>
<text x="1146.55" y="824.89" fill="#536760" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="end">3 / 4</text>
