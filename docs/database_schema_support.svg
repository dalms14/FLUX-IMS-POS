<text x="44" y="279" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">Product add-ons copy names and prices.</text>
<text x="430" y="294" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">Transactions store discountInfo snapshots.</text>
<text x="816" y="279" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">TTL index uses expireAfterSeconds = 0.</text>
<text x="816" y="295" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">Records are eligible for expiry at expiresAt.</text>
