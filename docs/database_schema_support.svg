<title>FLUX implemented database schema</title>
<desc>MongoDB collections and application-level ObjectId references, exported from the Mongoose models.</desc>
<rect x="0" y="0" width="1190.55" height="841.89" fill="#FFFFFF" stroke="none" stroke-width="0.8"/>
<text x="44" y="37" fill="#1F6053" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">FLUX / DATABASE DESIGN</text>
<text x="44" y="73" fill="#18352F" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Figure 10C. Catalog and supporting records</text>
<text x="44" y="96" fill="#536760" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">These five collections declare no ObjectId references to other models. Text snapshots do not create reference relationships.</text>
<text x="1146.55" y="37" fill="#536760" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="end">AS IMPLEMENTED  /  2026-10-30</text>
