<text x="638" y="507" fill="#18352F" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">createdAt, updatedAt</text>
<text x="1134" y="507" fill="#536760" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="end">Date</text>
<text x="44" y="553" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">Unique key: dataset + targetDate. Automatic timestamps are disabled.</text>
<text x="626" y="553" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">entityId is a string with a module context; no Mongoose ref is declared.</text>
<rect x="44" y="612" width="1102" height="159" fill="#F1F6F3" stroke="#CBD8D2" stroke-width="0.8"/>
<text x="62" y="640" fill="#1F6053" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">Storage boundaries for the paper</text>
<text x="62" y="665" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">Elite Member details are embedded in transactions; saved member templates live in browser localStorage.</text>
<text x="62" y="684" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">Supplier names and contacts are embedded in purchase orders; supplier entry history also lives in browser localStorage.</text>
<text x="62" y="703" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">There is no separate Member, Supplier, Payment, OrderItem, DeliveryReceipt, or StockMovement model in this implementation.</text>
<text x="62" y="722" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">Stock movement history is represented through audit events; sales and refund quantities also reside in their respective records.</text>
<text x="62" y="741" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">All 16 collections have generated document identifiers and version keys. Category and ForecastSnapshot have no automatic timestamps.</text>
</svg>