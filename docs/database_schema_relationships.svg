<svg xmlns="http://www.w3.org/2000/svg" width="1190.55" height="841.89" viewBox="0 0 1190.55 841.89">
<title>FLUX implemented database schema</title>
<desc>MongoDB collections and application-level ObjectId references, exported from the Mongoose models.</desc>
<rect x="0" y="0" width="1190.55" height="841.89" fill="#FFFFFF" stroke="none" stroke-width="0.8"/>
<text x="44" y="37" fill="#1F6053" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">FLUX / DATABASE DESIGN</text>
<text x="44" y="73" fill="#18352F" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Declared ObjectId relationship register</text>
<text x="44" y="96" fill="#536760" font-family="Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">The 17 references below correspond to the arrows in Figures 10A and 10B. MongoDB does not enforce their target existence.</text>
<text x="1146.55" y="37" fill="#536760" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="end">AS IMPLEMENTED  /  2026-10-30</text>
<rect x="44" y="807.89" width="1102.55" height="0.7" fill="#CBD8D2" stroke="none" stroke-width="0.8"/>
<text x="44" y="824.89" fill="#536760" font-family="Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="start">Arrows: stored reference -&gt; target collection. Rxx: relationship register on page 4. *: schema-required field.</text>
<text x="1146.55" y="824.89" fill="#536760" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="end">4 / 4</text>
