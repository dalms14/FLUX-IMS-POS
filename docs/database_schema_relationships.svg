<text x="44" y="670" fill="#1F6053" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">Relationship interpretation</text>
<text x="44" y="695" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">A required reference field must contain an identifier when its containing document exists; target existence is an application concern.</text>
<text x="44" y="714" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">One target may be referenced by many source documents. Array references may point to multiple targets from one source document.</text>
<text x="44" y="733" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">No unique index is declared on recipes.productId; a one-recipe-per-product database guarantee must not be claimed.</text>
<text x="44" y="752" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">Receipt itemId values point to items[]._id inside the same purchase order; they are not links to a separate collection.</text>
<text x="44" y="771" fill="#536760" font-family="Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">Only selected attributes appear in the figures. Data_Dictionary.md and database_schema.json retain the full 318-path structure.</text>
</svg>